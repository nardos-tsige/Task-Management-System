  <main class="app app-column">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">
          <svg class="brand-mark-svg" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
            <defs>
              <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="var(--accent)"/>
                <stop offset="1" stop-color="var(--accent-hover)"/>
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#markGrad)" stroke="var(--border)" stroke-opacity="0.25" stroke-width="1"/>
            <path d="M11 21 Q13.5 23.5 16 26 Q22 17 29 14" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.98"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Task Manager</h1>
          <p class="subtitle">Track your little wins here!</p>
        </div>
      </div>
      <button id="theme-toggle" class="theme-btn" type="button" aria-label="Toggle theme">
        <svg class="theme-icon theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="theme-icon theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </header>

    <section class="form-section">
      <form id="task-form" class="task-form" novalidate>
        <div class="form-row">
          <input type="text" id="task-input" class="task-input" placeholder="Add a new task..." autocomplete="off">
          <select id="task-priority" class="priority-select" aria-label="Task priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button id="add-btn" type="submit" class="add-btn" aria-label="Add task">
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span class="btn-text">Add</span>
          </button>
        </div>
        <div id="form-error" class="form-error" aria-live="polite"></div>
      </form>
    </section>

    <section class="toolbar-section">
      <div class="toolbar">
        <div class="search-wrapper">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search tasks..." autocomplete="off" aria-label="Search tasks">
        </div>
        <div id="filter-group" class="filter-group" role="tablist" aria-label="Task filters">
          <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
            <span>All</span>
            <span class="filter-count" id="count-all">0</span>
          </button>
          <button type="button" class="filter-btn" data-filter="pending" role="tab" aria-selected="false">
            <span>Pending</span>
            <span class="filter-count" id="count-pending">0</span>
          </button>
          <button type="button" class="filter-btn" data-filter="completed" role="tab" aria-selected="false">
            <span>Completed</span>
            <span class="filter-count" id="count-completed">0</span>
          </button>
        </div>
      </div>
      <div id="reorder-hint" class="reorder-hint" aria-live="polite"></div>
    </section>

    <div class="stats-strip" role="status" aria-live="polite">
      <div class="stat-col">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-lbl">Total</span>
      </div>
      <div class="stat-col">
        <span class="stat-num" id="stat-done">0</span>
        <span class="stat-lbl">Completed</span>
      </div>
      <div class="stat-col">
        <span class="stat-num" id="stat-pending">0</span>
        <span class="stat-lbl">Pending</span>
      </div>
    </div>

    <div class="main-content">
      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
    </div>
  </main>

  <script src="js/validation.js"></script>
  <script src="js/task.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
